<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <title>오키나와 완벽 맞춤형 여행 플래너</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        .line-clamp-2 {
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .custom-map-marker {
            background: #0891b2;
            color: white;
            border-radius: 50%;
            width: 28px;
            height: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 13px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
            border: 2px solid white;
        }
        input, select, textarea { font-size: 16px !important; }
    </style>
</head>
<body class="bg-[#f8fafc] text-slate-800 font-sans flex flex-col h-[100dvh] overflow-hidden">

    <!-- Header (상단 고정) -->
    <header class="shrink-0 bg-gradient-to-r from-cyan-600 to-blue-700 text-white shadow-md z-40 relative">
        <div class="max-w-7xl mx-auto px-4 py-3 lg:py-4 flex flex-col sm:flex-row items-center justify-between gap-3">
            <h1 class="text-xl sm:text-2xl lg:text-3xl font-bold flex items-center gap-2">
                <i class="fa-solid fa-plane-departure"></i> 오키나와 자유여행 플래너
            </h1>
            <div class="flex items-center gap-2">
                <div class="bg-white/15 px-3 py-1.5 rounded-full backdrop-blur-sm text-[13px] sm:text-sm lg:text-base font-medium text-cyan-50 flex items-center shadow-inner tracking-tight">
                    <i class="fa-regular fa-calendar-check mr-2 text-cyan-200"></i>
                    <span id="header-date-display">2026. 12. 27. - 2027. 01. 03.</span>
                </div>
                <button onclick="openSettingsModal()" class="bg-white/20 hover:bg-white text-white hover:text-cyan-700 w-8 h-8 sm:w-9 sm:h-9 rounded-full transition shadow-sm flex items-center justify-center border border-white/30" title="일정 및 관리 설정">
                    <i class="fa-solid fa-gear text-base sm:text-lg"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- 3단 분할 메인 레이아웃 (태블릿/PC 대응) -->
    <div class="flex flex-1 overflow-hidden relative">
        
        <!-- Left Sidebar: Day Tabs (Desktop 전용) -->
        <aside class="hidden lg:flex flex-col w-[240px] xl:w-[280px] bg-white border-r border-slate-200 overflow-y-auto p-4 shrink-0 shadow-[4px_0_24px_rgba(0,0,0,0.02)] z-10 hide-scrollbar">
            <h2 class="text-xs font-bold text-slate-400 mb-3 px-1 uppercase tracking-wider"><i class="fa-solid fa-list-check mr-1"></i>일정 선택</h2>
            <div id="desktop-day-tabs" class="space-y-2">
                <!-- JS 렌더링 -->
            </div>
        </aside>

        <!-- Center: Main Timeline Content -->
        <main class="flex-1 overflow-y-auto relative bg-[#f8fafc] scroll-smooth p-0 lg:p-6" id="main-scroll-area">
            <!-- Mobile Day Tabs -->
            <div class="lg:hidden p-4 pb-1">
                <div class="bg-white rounded-xl border border-slate-200 p-2 shadow-inner w-full">
                    <div id="mobile-day-tabs" class="flex flex-nowrap overflow-x-auto gap-1.5 w-full hide-scrollbar"></div>
                </div>
            </div>
            
            <div id="day-content" class="max-w-3xl mx-auto p-4 lg:p-0 space-y-4"></div>
        </main>

        <!-- Right Sidebar: Add Place Panel (Desktop 사이드바 & Mobile 모달 혼용) -->
        <aside id="timelineAddModal" class="hidden lg:flex fixed inset-0 z-[50] bg-slate-900/60 lg:bg-white lg:static lg:w-[380px] xl:w-[420px] lg:border-l lg:border-slate-200 shrink-0 h-full items-end sm:items-center justify-center p-0 sm:p-4 lg:p-0 lg:z-10 lg:shadow-[-4px_0_24px_rgba(0,0,0,0.02)]">
            <div class="bg-white w-full max-w-2xl lg:max-w-none shadow-2xl lg:shadow-none overflow-hidden flex flex-col h-[90vh] lg:h-full mt-auto sm:m-auto lg:m-0 rounded-t-3xl sm:rounded-2xl lg:rounded-none">
                
                <!-- Header -->
                <div class="bg-gradient-to-r from-cyan-600 to-blue-700 lg:bg-none lg:bg-slate-50 px-6 py-4 lg:py-5 flex justify-between items-center text-white lg:text-slate-800 shrink-0 lg:border-b lg:border-slate-200 shadow-sm lg:shadow-none">
                    <h3 id="modal-title" class="font-bold text-lg lg:text-base tracking-tight flex items-center">
                        <i class="fa-solid fa-calendar-plus mr-2 text-cyan-200 lg:text-cyan-600"></i>Day 1 장소 추가
                    </h3>
                    <button onclick="closeTimelineAddModal()" class="text-white/80 hover:text-white lg:hidden transition"><i class="fa-solid fa-xmark text-2xl"></i></button>
                </div>

                <!-- Content -->
                <div class="p-5 lg:p-5 overflow-y-auto bg-slate-50 lg:bg-white flex-1 space-y-5 hide-scrollbar">
                    <!-- 지역 탭 -->
                    <div class="flex bg-slate-200/70 lg:bg-slate-100 p-1 rounded-xl">
                        <button onclick="switchRegion('south')" id="btn-south" class="flex-1 py-2 rounded-lg text-xs sm:text-sm font-bold transition bg-white text-cyan-700 shadow-sm">남부</button>
                        <button onclick="switchRegion('central')" id="btn-central" class="flex-1 py-2 rounded-lg text-xs sm:text-sm font-bold transition text-slate-500 hover:text-slate-800">중부</button>
                        <button onclick="switchRegion('north')" id="btn-north" class="flex-1 py-2 rounded-lg text-xs sm:text-sm font-bold transition text-slate-500 hover:text-slate-800">북부</button>
                    </div>

                    <!-- 카테고리 탭 -->
                    <div class="flex flex-wrap gap-2">
                        <button onclick="switchCategory('관광지')" id="cat-관광지" class="px-3.5 py-1.5 rounded-lg text-xs sm:text-sm font-bold transition bg-cyan-600 text-white shadow-sm">관광지</button>
                        <button onclick="switchCategory('식당')" id="cat-식당" class="px-3.5 py-1.5 rounded-lg text-xs sm:text-sm font-bold transition bg-white lg:bg-slate-50 border border-slate-200 text-slate-600 hover:bg-slate-100">식당</button>
                        <button onclick="switchCategory('카페')" id="cat-카페" class="px-3.5 py-1.5 rounded-lg text-xs sm:text-sm font-bold transition bg-white lg:bg-slate-50 border border-slate-200 text-slate-600 hover:bg-slate-100">카페</button>
                        <button onclick="switchCategory('쇼핑')" id="cat-쇼핑" class="px-3.5 py-1.5 rounded-lg text-xs sm:text-sm font-bold transition bg-white lg:bg-slate-50 border border-slate-200 text-slate-600 hover:bg-slate-100">쇼핑</button>
                        <button onclick="switchCategory('액티비티')" id="cat-액티비티" class="px-3.5 py-1.5 rounded-lg text-xs sm:text-sm font-bold transition bg-white lg:bg-slate-50 border border-slate-200 text-slate-600 hover:bg-slate-100">액티비티</button>
                        <button onclick="switchCategory('호텔')" id="cat-호텔" class="px-3.5 py-1.5 rounded-lg text-xs sm:text-sm font-bold transition bg-white lg:bg-slate-50 border border-slate-200 text-slate-600 hover:bg-slate-100">호텔</button>
                    </div>

                    <!-- 장소 카드 목록 -->
                    <div id="places-container" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-1 gap-4">
                        <!-- JS 렌더링 -->
                    </div>
                </div>
            </div>
        </aside>
    </div>

    <!-- 이하 설정 및 기타 모달들 (기존과 동일하게 유지, z-index만 정리) -->
    
    <!-- 설정 모달 -->
    <div id="settingsModal" class="hidden fixed inset-0 z-[80] bg-slate-900/70 backdrop-blur-sm flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl w-full max-w-sm shadow-2xl overflow-hidden flex flex-col max-h-[90vh]">
            <div class="bg-slate-800 px-5 py-4 flex justify-between items-center text-white shrink-0">
                <h3 class="font-bold text-base"><i class="fa-solid fa-gear mr-2"></i>플래너 설정 및 관리</h3>
                <button onclick="closeSettingsModal()" class="text-white/80 hover:text-white"><i class="fa-solid fa-xmark text-xl"></i></button>
            </div>
            <div class="p-5 space-y-5 overflow-y-auto hide-scrollbar">
                
                <!-- 날짜 설정 -->
                <div>
                    <h4 class="text-xs font-bold text-slate-500 mb-2"><i class="fa-regular fa-calendar mr-1"></i>여행 날짜 설정</h4>
                    <div class="flex gap-2 mb-3">
                        <div class="flex-1">
                            <label class="block text-[11px] text-slate-500 mb-1">출발 날짜</label>
                            <input type="date" id="startDate" class="w-full box-border bg-slate-50 border border-slate-300 text-slate-800 px-2 py-1.5 rounded outline-none focus:border-cyan-400">
                        </div>
                        <div class="flex-1">
                            <label class="block text-[11px] text-slate-500 mb-1">귀국 날짜</label>
                            <input type="date" id="endDate" class="w-full box-border bg-slate-50 border border-slate-300 text-slate-800 px-2 py-1.5 rounded outline-none focus:border-cyan-400">
                        </div>
                    </div>
                </div>
                
                <!-- 동행자 설정 -->
                <div>
                    <h4 class="text-xs font-bold text-slate-500 mb-1.5"><i class="fa-solid fa-users mr-1"></i>Day별 함께하는 친구들</h4>
                    <p class="text-[10px] text-slate-400 mb-2">각 일자별로 동행하는 친구들의 이름을 입력하세요.</p>
                    <div id="day-companions-container" class="space-y-1.5 max-h-32 overflow-y-auto pr-1 hide-scrollbar"></div>
                </div>

                <button onclick="updateTripSettings()" class="w-full bg-cyan-600 hover:bg-cyan-700 text-white px-3 py-2.5 rounded-lg text-sm font-bold transition shadow-sm">설정 내역 저장</button>
                
                <hr class="border-slate-100">

                <!-- 공유 기능 -->
                <div>
                    <h4 class="text-xs font-bold text-slate-500 mb-2"><i class="fa-solid fa-share-nodes mr-1"></i>일정 공유하기</h4>
                    <button onclick="shareFromSettings()" class="w-full bg-[#FEE500] hover:bg-[#FADA0A] text-[#191919] py-2.5 rounded-lg font-bold text-sm transition shadow-sm flex items-center justify-center gap-1.5">
                        <i class="fa-solid fa-image"></i> 전체 일정 이미지로 저장/공유
                    </button>
                </div>

                <hr class="border-slate-100">

                <!-- 커스텀 장소 추가 -->
                <div>
                    <h4 class="text-xs font-bold text-slate-500 mb-2"><i class="fa-solid fa-map-pin mr-1"></i>나만의 장소 관리</h4>
                    <div class="flex gap-2">
                        <button onclick="closeSettingsModal(); openAddModal();" class="w-full bg-indigo-500 hover:bg-indigo-600 text-white py-2 rounded-lg font-bold text-sm transition shadow-sm flex items-center justify-center gap-1">
                            <i class="fa-solid fa-plus-circle"></i> 새로운 장소 직접 등록하기
                        </button>
                    </div>
                </div>

                <hr class="border-slate-100">

                <!-- 데이터 관리 -->
                <div>
                    <h4 class="text-xs font-bold text-slate-500 mb-2"><i class="fa-solid fa-database mr-1"></i>데이터 백업/복구</h4>
                    <div class="flex gap-2">
                        <button onclick="exportBackupData()" class="flex-1 bg-sky-500 hover:bg-sky-600 text-white py-2 rounded-lg font-bold text-sm transition shadow-sm flex items-center justify-center gap-1.5">
                            <i class="fa-solid fa-download"></i> 백업
                        </button>
                        <label class="flex-1 bg-amber-500 hover:bg-amber-600 text-white py-2 rounded-lg font-bold text-sm transition shadow-sm flex items-center justify-center gap-1.5 cursor-pointer m-0">
                            <i class="fa-solid fa-upload"></i> 복구
                            <input type="file" accept=".json" onchange="importBackupData(event)" class="hidden">
                        </label>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 전체위치 지도 모달 -->
    <div id="mapModal" class="hidden fixed inset-0 z-[70] bg-slate-900/70 backdrop-blur-sm flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl w-full max-w-3xl shadow-2xl overflow-hidden flex flex-col h-[85vh]">
            <div class="bg-gradient-to-r from-emerald-600 to-teal-700 px-6 py-4 flex justify-between items-center text-white shrink-0">
                <h3 id="map-modal-title" class="font-bold text-base"><i class="fa-solid fa-map-location-dot mr-2"></i>Day별 전체위치 지도</h3>
                <button onclick="closeMapModal()" class="text-white/80 hover:text-white"><i class="fa-solid fa-xmark text-xl"></i></button>
            </div>
            <div class="p-4 flex-1 bg-slate-100 flex flex-col">
                <div id="dayMapContainer" class="w-full flex-1 rounded-xl shadow-inner border border-slate-300 z-10"></div>
            </div>
            <div class="p-3 bg-white border-t border-slate-200 flex justify-end">
                <button onclick="closeMapModal()" class="bg-slate-700 hover:bg-slate-800 text-white px-6 py-2.5 rounded-lg font-bold text-sm transition">닫기</button>
            </div>
        </div>
    </div>

    <!-- Custom Place Modal (새장소 직접등록) -->
    <div id="addPlaceModal" class="hidden fixed inset-0 z-[90] bg-slate-900/70 backdrop-blur-sm flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl w-full max-w-md shadow-2xl overflow-hidden">
            <div id="modal-header-bg" class="bg-gradient-to-r from-indigo-500 to-purple-600 px-5 py-4 flex justify-between items-center text-white">
                <h3 id="custom-modal-title" class="font-bold text-base"><i class="fa-solid fa-plus-circle mr-2"></i>새로운 장소 / 호텔 직접 등록</h3>
                <button onclick="closeAddModal()" class="text-white/80 hover:text-white"><i class="fa-solid fa-xmark text-xl"></i></button>
            </div>
            <div class="p-5 space-y-4 h-[75vh] sm:h-auto overflow-y-auto">
                <input type="hidden" id="editingPlaceId" value="">
                <div>
                    <div class="flex justify-between items-center mb-1">
                        <label class="block text-xs font-bold text-slate-700">장소명 / 숙소명</label>
                        <button type="button" onclick="fetchCoordsByName()" class="bg-emerald-600 hover:bg-emerald-700 text-white text-[11px] font-bold px-2 py-0.5 rounded shadow-sm transition flex items-center gap-1">
                            <i class="fa-solid fa-location-crosshairs"></i> 위도·경도 불러오기
                        </button>
                    </div>
                    <input type="text" id="customPlaceName" placeholder="예: 블루씰 아이스크림" class="w-full box-border border border-slate-300 rounded-lg px-3 py-2 outline-none focus:border-indigo-500">
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-bold text-slate-700 mb-1">지역</label>
                        <select id="customPlaceRegion" class="w-full box-border border border-slate-300 rounded-lg px-3 py-2 bg-white outline-none">
                            <option value="south">남부</option>
                            <option value="central">중부</option>
                            <option value="north">북부</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-700 mb-1">분류</label>
                        <select id="customPlaceGroup" class="w-full box-border border border-slate-300 rounded-lg px-3 py-2 bg-white outline-none">
                            <option value="관광지">관광지</option>
                            <option value="식당">식당</option>
                            <option value="카페" selected>카페</option>
                            <option value="쇼핑">쇼핑</option>
                            <option value="액티비티">액티비티</option>
                            <option value="호텔">호텔</option>
                        </select>
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1">장소 설명 (선택)</label>
                    <textarea id="customPlaceDesc" rows="2" placeholder="간단한 설명이나 메모를 입력하세요." class="w-full box-border border border-slate-300 rounded-lg px-3 py-2 outline-none focus:border-indigo-500"></textarea>
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1">
                        <i class="fa-solid fa-map-pin mr-1 text-rose-500"></i>위도 / 경도 좌표 (선택)
                    </label>
                    <div class="grid grid-cols-2 gap-2">
                        <input type="text" id="customLat" placeholder="위도 (예: 26.1738)" class="border box-border border-slate-300 rounded-lg px-3 py-2 outline-none focus:border-indigo-500" oninput="handleCustomCoordPaste(event)">
                        <input type="text" id="customLng" placeholder="경도 (예: 127.6429)" class="border box-border border-slate-300 rounded-lg px-3 py-2 outline-none focus:border-indigo-500" oninput="handleCustomCoordPaste(event)">
                    </div>
                </div>
                
                <div class="pt-3 flex gap-2">
                    <button onclick="registerCustomPlace()" id="customAddBtn" class="flex-1 bg-indigo-600 hover:bg-indigo-700 text-white py-2.5 rounded-lg font-bold text-sm sm:text-base transition shadow-sm">등록하기</button>
                    <button onclick="closeAddModal()" class="bg-slate-100 hover:bg-slate-200 text-slate-600 px-4 py-2.5 rounded-lg font-bold text-sm sm:text-base transition">닫기</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const defaultPlacesData = {
            south: [
                { id: 's_att1', group: '관광지', name: '나하 공항', category: '교통/시작점', desc: '오키나와 남부 여행의 시작점이 되는 관문 공항.', lat: 26.2056, lng: 127.6472 },
                { id: 's_att2', group: '관광지', name: '슈리성', category: '역사유적', desc: '류큐 왕국의 화려한 궁전 유적으로 붉은 성곽과 전통 건축미를 자랑하는 명소입니다.', lat: 26.2253, lng: 127.7197 },
                { id: 's_att3', group: '관광지', name: '국제거리', category: '번화가', desc: '나하 최대의 번화가로 기념품 샵, 맛집, 돈키호테 등이 밀집해 있는 쇼핑의 거리입니다.', lat: 26.2150, lng: 127.6882 },
                { id: 's_att4', group: '카페', name: 'ZHYVAGO COFFEE ROASTERY', category: '카페', desc: '오키나와 감성 가득한 해안가 로스터리 카페입니다.', lat: 26.3200, lng: 127.7500 }
            ],
            central: [
                { id: 'c_att1', group: '관광지', name: '만좌모', category: '자연경관', desc: '코끼리 바위 모양의 기암괴석과 끝없이 펼쳐진 푸른 바다를 조망할 수 있는 절경입니다.', lat: 26.5028, lng: 127.8464 },
                { id: 'c_att2', group: '관광지', name: '아메리칸 빌리지', category: '테마타운', desc: '미국 서해안 분위기를 재현한 이국적인 타운으로 대관람차와 석양이 유명합니다.', lat: 26.3160, lng: 127.7580 }
            ],
            north: [
                { id: 'n_att1', group: '관광지', name: '츄라우미 수족관', category: '수족관', desc: '거대한 고래상어와 만타가 헤엄치는 대형 수조로 유명한 북부 필수 코스입니다.', lat: 26.6944, lng: 127.8778 },
                { id: 'n_att2', group: '관광지', name: '코우리 대교 & 오션타워', category: '자연경관', desc: '에메랄드빛 바다 위를 시원하게 가로지르는 길게 뻗은 대교입니다.', lat: 26.6991, lng: 128.0245 }
            ]
        };

        let placesData = defaultPlacesData;
        try {
            const savedPlaces = localStorage.getItem('okinawa_placesData');
            if (savedPlaces) placesData = JSON.parse(savedPlaces);
        } catch(e) { console.error('기존 장소 데이터 로드 실패'); }

        let tripData = { startDate: '2026-12-27', endDate: '2027-01-03', days: [], activeDay: -1 };
        try {
            const savedTrip = localStorage.getItem('okinawa_tripData');
            if (savedTrip) tripData = JSON.parse(savedTrip);

        function generateDaysFromDates() {
            const startVal = document.getElementById('startDate').value || '2026-12-27';
            const endVal = document.getElementById('endDate').value || '2027-01-03';
            const start = new Date(startVal.replace(/-/g, '/')); const end = new Date(endVal.replace(/-/g, '/'));
            
            let timeDiff = end.getTime() - start.getTime();
            let dayCount = Math.floor(timeDiff / (1000 * 3600 * 24)) + 1;
            if (isNaN(dayCount) || dayCount <= 0) dayCount = 1;
            
            const weekNames = ['일', '월', '화', '수', '목', '금', '토'];
            let oldDays = tripData.days || [];
            let newDays = [];
            for (let i = 0; i < dayCount; i++) {
                let currDate = new Date(start); currDate.setDate(start.getDate() + i);
                let dateStr = `${currDate.getMonth() + 1}/${currDate.getDate()} (${weekNames[currDate.getDay()]})`;
                let existing = oldDays[i] || { events: [], companions: '' };
                newDays.push({ dayNum: i + 1, date: dateStr, events: existing.events, companions: existing.companions });
            }
            tripData.days = newDays;
            if (tripData.activeDay !== -1 && tripData.activeDay >= dayCount) tripData.activeDay = -1;
            saveDataToLocalStorage();
        }

        function calculateRouteInfo(lat1, lon1, lat2, lon2, mode) {
            let nLat1 = parseFloat(lat1); let nLon1 = parseFloat(lon1); let nLat2 = parseFloat(lat2); let nLon2 = parseFloat(lon2);
            if (isNaN(nLat1) || isNaN(nLon1) || isNaN(nLat2) || isNaN(nLon2)) return { distance: '알 수 없음', duration: '-' };
            const R = 6371; const dLat = (nLat2 - nLat1) * (Math.PI / 180); const dLon = (nLon2 - nLon1) * (Math.PI / 180);
            const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) + Math.cos(nLat1 * (Math.PI / 180)) * Math.cos(nLat2 * (Math.PI / 180)) * Math.sin(dLon / 2) * Math.sin(dLon / 2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a)); let d = R * c; 
            let roadDistance = mode === '도보' || mode === '자전거' ? d * 1.2 : d * 1.35; 
            if (roadDistance < 0.1) roadDistance = 0.1;
            let speed = mode==='운전'?35 : mode==='대중교통'?22 : mode==='자전거'?15 : 4;
            let extraTime = mode==='운전'?5 : mode==='대중교통'?15 : 0;
            let hours = roadDistance / speed; let mins = Math.max(1, Math.round(hours * 60) + extraTime);
            return { distance: `${roadDistance.toFixed(1)} km`, duration: mins >= 60 ? `${Math.floor(mins/60)}시간 ${mins%60}분` : `${mins}분` };
        }

            dTabs += days.map((d, idx) => `
                <button onclick="setActiveDay(${idx})" class="w-full text-left px-4 py-3 rounded-xl font-bold transition flex flex-col gap-0.5 ${idx === tripData.activeDay ? 'bg-slate-900 text-white shadow-md' : 'bg-white hover:bg-slate-100 text-slate-600'}">

                    <span class="text-xs ${idx === tripData.activeDay ? 'text-slate-300' : 'text-slate-400 font-medium'}">${d.date}</span>
                </button>
            `).join('');
            document.getElementById('desktop-day-tabs').innerHTML = dTabs;

            // 모바일 전용 상단 탭
            let mTabs = `<button onclick="setActiveDay(-1)" class="flex-1 min-w-[72px] px-2 py-2.5 rounded-lg text-sm font-bold transition whitespace-nowrap border ${tripData.activeDay === -1 ? 'bg-cyan-600 border-cyan-600 text-white shadow-md' : 'bg-white border-slate-200 text-slate-500 hover:text-slate-700 hover:bg-slate-50'}">전체일정</button>`;
            mTabs += days.map((d, idx) => `
                <button onclick="setActiveDay(${idx})" class="flex-1 min-w-[64px] px-2 py-2.5 rounded-lg text-sm font-bold transition whitespace-nowrap border ${idx === tripData.activeDay ? 'bg-cyan-50 border-cyan-400 text-cyan-800 shadow-sm' : 'bg-white border-slate-200 text-slate-500 hover:text-slate-700 hover:bg-slate-50'}">
                    Day ${d.dayNum}
                </button>
            `).join('');
            document.getElementById('mobile-day-tabs').innerHTML = mTabs;

            // 메인 타임라인 렌더링
            const contentContainer = document.getElementById('day-content');
            if (tripData.activeDay === -1) {
                contentContainer.innerHTML = days.map((d, i) => renderDayContent(i, true)).join('');
            } else {
                if (days[tripData.activeDay]) {
                    contentContainer.innerHTML = renderDayContent(tripData.activeDay, false);
                }
            }
        }
        
        function updateEventMemo(dayIdx, evtIdx, val) { tripData.days[dayIdx].events[evtIdx].memo = val; saveDataToLocalStorage(); }

        function openDayMapModal(dayIdx) {
            const dayObj = tripData.days[dayIdx];
            if (!dayObj || !dayObj.events || dayObj.events.length === 0) { alert('지도에 표시할 일정이 없습니다.'); return; }
            const routeEvents = (dayObj.events[0] && (dayObj.events[0].type === 'hotel' || dayObj.events[0].group === '호텔')) ? dayObj.events.slice(1) : dayObj.events;
            let validEvents = routeEvents.filter(e => e.lat && e.lng);
            if (validEvents.length === 0) { alert('좌표가 등록된 장소가 없습니다.'); return; }

            document.getElementById('map-modal-title').innerHTML = `<i class="fa-solid fa-map-location-dot mr-2"></i>Day ${dayObj.dayNum} 전체위치 (${validEvents.length}개소)`;
            document.getElementById('mapModal').classList.remove('hidden');

            setTimeout(() => {
                if (leafletMap) { leafletMap.remove(); leafletMap = null; }
                leafletMap = L.map('dayMapContainer').setView([26.3, 127.8], 10);
                L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 18, attribution: '&copy; OpenStreetMap contributors' }).addTo(leafletMap);
                let bounds = [];
                validEvents.forEach((evt, idx) => {
                    let lat = parseFloat(evt.lat); let lng = parseFloat(evt.lng); bounds.push([lat, lng]);
                    let numberIcon = L.divIcon({ className: 'custom-marker-container', html: `<div class="custom-map-marker">${idx + 1}</div>`, iconSize: [28, 28], iconAnchor: [14, 14] });
                    let popupContent = `<div style="font-family: sans-serif; padding: 4px; min-width: 150px;">
                        <span style="background: #0891b2; color: white; padding: 2px 6px; border-radius: 4px; font-size: 11px; font-weight: bold;">${idx + 1}번 장소</span>
                        <h4 style="font-weight: bold; font-size: 14px; margin: 6px 0 4px 0; color: #0f172a;">${evt.name}</h4>
                    </div>`;
                    L.marker([lat, lng], { icon: numberIcon }).addTo(leafletMap).bindPopup(popupContent);
                });
                if (bounds.length > 0) leafletMap.fitBounds(bounds, { padding: [50, 50] });
            }, 100);
        }

        function closeMapModal() { document.getElementById('mapModal').classList.add('hidden'); if (leafletMap) { leafletMap.remove(); leafletMap = null; } }

        function setActiveDay(idx) { 
            tripData.activeDay = idx; 
            targetAddDayIdx = idx === -1 ? 0 : idx; // 전체일정 선택시 우측패널 기본타겟을 Day1으로 설정
            updateAddPanelTitle('place', targetAddDayIdx);
            renderPlanner(); 
        }

        function moveEvent(dayIdx, evtIdx, dir) {
            const evts = tripData.days[dayIdx].events; const tgt = evtIdx + dir;
            if (tgt < 0 || tgt >= evts.length) return;
            let temp = evts[evtIdx]; evts[evtIdx] = evts[tgt]; evts[tgt] = temp;
            renderPlanner(); saveDataToLocalStorage();
        }
        function removeEvent(dayIdx, evtIdx) { tripData.days[dayIdx].events.splice(evtIdx, 1); renderPlanner(); saveDataToLocalStorage(); }
        function updateEventTransport(dayIdx, evtIdx, val) { tripData.days[dayIdx].events[evtIdx].transport = val; renderPlanner(); saveDataToLocalStorage(); }

        function openTimelineAddModal(mode, dayIdx) {
            addMode = mode; targetAddDayIdx = dayIdx; 
            updateAddPanelTitle(mode, dayIdx);
            switchCategory(mode === 'hotel' ? '호텔' : '관광지');
            document.getElementById('timelineAddModal').classList.remove('hidden'); 
            renderPlaces();
        }
        
        function closeTimelineAddModal() { 
            // lg 환경에서는 항상 보여야하므로 hidden 클래스 추가를 통해 모바일에서만 닫히도록 동작
            document.getElementById('timelineAddModal').classList.add('hidden'); 
        }
        
        // 커스텀 장소 등록 관련
        function openAddModal() {
            document.getElementById('editingPlaceId').value = '';
            document.getElementById('custom-modal-title').innerHTML = '<i class="fa-solid fa-plus-circle mr-2"></i>새로운 장소 직접 등록';
            document.getElementById('customAddBtn').innerText = '등록하기';
            document.getElementById('customPlaceName').value = ''; document.getElementById('customLat').value = ''; document.getElementById('customLng').value = ''; document.getElementById('customPlaceDesc').value = '';
            if (addMode === 'hotel') document.getElementById('customPlaceGroup').value = '호텔';
            document.getElementById('addPlaceModal').classList.remove('hidden'); document.getElementById('customPlaceName').focus();
        }

        function closeAddModal() { document.getElementById('addPlaceModal').classList.add('hidden'); }

        async function fetchCoordsByName() {
            const nameInput = document.getElementById('customPlaceName').value.trim();
            if (!nameInput) { alert('먼저 장소명을 입력해주세요.'); document.getElementById('customPlaceName').focus(); return; }
            const queryName = nameInput.includes('오키나와') ? nameInput : `${nameInput} 오키나와`;
            const btn = event.currentTarget; const originalText = btn.innerHTML;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> 검색중...'; btn.disabled = true;
            try {
                const response = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(queryName)}&viewbox=127.5,26.0,128.5,27.0&bounded=1&limit=1`);
                const data = await response.json();
                if (data && data.length > 0) {
                    const lat = parseFloat(data[0].lat).toFixed(4); const lon = parseFloat(data[0].lon).toFixed(4);
                    document.getElementById('customLat').value = lat; document.getElementById('customLng').value = lon;
                    alert(`위치를 찾았습니다!\n위도: ${lat}, 경도: ${lon}`);
                } else { alert(`자동 검색 결과가 없습니다.`); }
            } catch (err) { alert('오류가 발생했습니다.'); } finally { btn.innerHTML = originalText; btn.disabled = false; }
        }

        function registerCustomPlace() {
            const name = document.getElementById('customPlaceName').value.trim(); 
            const region = document.getElementById('customPlaceRegion').value;
            const group = document.getElementById('customPlaceGroup').value; 
            const desc = document.getElementById('customPlaceDesc').value.trim() || '직접 등록한 맞춤형 장소입니다.';
            let latNum = parseFloat(document.getElementById('customLat').value.trim()) || 26.35; 
            let lngNum = parseFloat(document.getElementById('customLng').value.trim()) || 127.78;
            if (!name) { alert('장소명을 입력해주세요.'); return; }

            const newPlace = { id: 'custom-' + Date.now(), group: group, name: name, category: '커스텀명소', desc: desc, lat: latNum, lng: lngNum };
            if(!placesData[region]) placesData[region] = []; 
            placesData[region].push(newPlace);
            switchRegion(region); switchCategory(group); renderPlaces(); saveDataToLocalStorage(); closeAddModal();
            alert(`[${name}] 장소가 우측 목록에 등록되었습니다.`);
        }
    </script>
</body>
</html>
